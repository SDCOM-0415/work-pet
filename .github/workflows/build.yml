name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+：daemon 的 CodeArts Agent 账号切换依赖内置 node:sqlite（读写 state.vscdb）
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-ui/src-tauri

      - name: Bundle Node.js runtime and scripts (flat packaging)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-ui/src-tauri/binaries | Out-Null
          Copy-Item "C:/Program Files/nodejs/node.exe" desktop-ui/src-tauri/binaries/node.exe
          Copy-Item "daemon.js" desktop-ui/src-tauri/daemon.js
          Copy-Item "credit-segments.js" desktop-ui/src-tauri/credit-segments.js

      - name: Install dependencies
        working-directory: desktop-ui
        run: npm install

      - name: Build (NSIS installer)
        working-directory: desktop-ui
        run: npx tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workpet-windows
          path: |
            desktop-ui/src-tauri/target/release/workpet.exe
            desktop-ui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error


  release:
    name: Publish Release
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ls -lhR dist

          ASSETS=$(find dist -type f \( -name "*-setup.exe" -o -name "*.dmg" \))
          if [ -z "$ASSETS" ]; then
            echo "ERROR: no release assets found" >&2
            exit 1
          fi
          echo "Assets to upload:"
          echo "$ASSETS"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          elif echo "$TAG" | grep -Eq -- '-(beta|rc|alpha)'; then
            # 测试版：tag 带 -beta/-rc/-alpha 后缀 → 预发布（不占用 latest，不影响正式版更新提示）
            gh release create "$TAG" $ASSETS \
              --title "WorkPet ${TAG#v} (Testing)" \
              --generate-notes \
              --prerelease
          else
            gh release create "$TAG" $ASSETS \
              --title "WorkPet ${TAG#v}" \
              --generate-notes \
              --latest
          fi
