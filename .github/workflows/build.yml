name: Build WorkPet

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: desktop-ui
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop-ui/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop-ui/src-tauri/Cargo.lock') }}

      - name: Build Tauri app (Windows)
        working-directory: desktop-ui
        run: npx tauri build

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkPet-windows-x64
          path: desktop-ui/src-tauri/bin/release/bundle/nsis/
          retention-days: 7

  build-macos:
    name: Build (macOS universal)
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle platform node binary
        run: |
          mkdir -p desktop-ui/src-tauri/binaries
          cp "$(command -v node)" desktop-ui/src-tauri/binaries/node
          chmod +x desktop-ui/src-tauri/binaries/node
          echo "Bundled: $(file desktop-ui/src-tauri/binaries/node)"

      - name: Install frontend deps
        working-directory: desktop-ui
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop-ui/src-tauri/target/
          key: ${{ runner.os }}-macos-universal-cargo-${{ hashFiles('desktop-ui/src-tauri/Cargo.lock') }}

      - name: Build Tauri app (${{ matrix.target }})
        working-directory: desktop-ui
        run: npx tauri build --target ${{ matrix.target }}

      - name: Archive ${{ matrix.target }} .app
        run: |
          cp -R src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app \
              src-tauri/target/universal-${{ matrix.target }}.app
        working-directory: desktop-ui

      - name: Upload ${{ matrix.target }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: desktop-ui/src-tauri/target/universal-${{ matrix.target }}.app
          retention-days: 7

  merge-universal:
    name: Merge → Universal macOS
    runs-on: macos-latest
    needs: build-macos
    steps:
      - uses: actions/checkout@v4

      - name: Download aarch64 .app
        uses: actions/download-artifact@v4
        with:
          name: macos-aarch64-apple-darwin
          path: universal/aarch64

      - name: Download x86_64 .app
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-apple-darwin
          path: universal/x86_64

      - name: Create universal binary
        run: |
          APP="universal/aarch64/*.app"
          APP=$(ls "$APP" 2>/dev/null || ls universal/aarch64/*.app)
          BINARY="$APP/Contents/MacOS/work-pet"
          UNIVERSAL="universal/universal-work-pet"
          lipo -create \
            "universal/aarch64/${BINARY##*/}" \
            "universal/x86_64/${BINARY##*/}" \
            -output "$UNIVERSAL"
          echo "Universal binary created:"
          file "$UNIVERSAL"

      - name: Replace binary in aarch64 .app
        run: |
          BUNDLE=$(ls universal/aarch64/*.app)
          DEST="$BUNDLE/Contents/MacOS/work-pet"
          cp "$(ls universal/aarch64/*.app)/Contents/MacOS/work-pet" /tmp/work-pet-aarch64 2>/dev/null || true
          cp universal/universal-work-pet "$DEST"
          chmod +x "$DEST"
          echo "Replacing binary in: $BUNDLE"
          ls -la "$DEST"

      - name: Package universal DMG
        run: |
          APP_BUNDLE=$(ls universal/aarch64/*.app)
          # Re-sign with hardened runtime for universal binary
          codesign --force --deep --sign - "$APP_BUNDLE" \
            --options runtime --timestamp || true
          # Use Apple's create-dmg or hdiutil to create DMG
          cp -r "$APP_BUNDLE" Desktop
          hdiutil create -volname "WorkPet" -srcfolder Desktop \
            -ov -format UDZO "WorkPet-universal.dmg"
          rm -rf Desktop
          mv WorkPet-universal.dmg src-tauri/bin/release/bundle/dmg/
          echo "DMG created: src-tauri/bin/release/bundle/dmg/"
          ls -la src-tauri/bin/release/bundle/dmg/

      - name: Upload universal DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkPet-macos-universal
          path: desktop-ui/src-tauri/bin/release/bundle/dmg/
          retention-days: 7
