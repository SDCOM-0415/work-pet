name: Build WorkPet

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend deps
        working-directory: desktop-ui
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop-ui/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop-ui/src-tauri/Cargo.lock') }}

      - name: Build Tauri app (Windows)
        working-directory: desktop-ui
        run: npx tauri build

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkPet-windows-x64
          path: desktop-ui/src-tauri/bin/release/bundle/nsis/
          retention-days: 7

  build-macos:
    name: Build (macOS universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare JS resources (copy from repo root)
        run: |
          ROOT="$(git -C "$(pwd)" rev-parse --show-toplevel)"
          cp "$ROOT/daemon.js"          desktop-ui/src-tauri/daemon.js
          cp "$ROOT/credit-segments.js" desktop-ui/src-tauri/credit-segments.js
          ls -la desktop-ui/src-tauri/{daemon,credit-segments}.js

      - name: Install frontend deps
        working-directory: desktop-ui
        run: npm ci

      - name: Install Rust stable (both macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop-ui/src-tauri/target/
          key: ${{ runner.os }}-macos-universal-cargo-${{ hashFiles('desktop-ui/src-tauri/Cargo.lock') }}

      - name: Build universal macOS app
        working-directory: desktop-ui
        run: npx tauri build --target universal-apple-darwin

      - name: Verify universal binary
        working-directory: desktop-ui
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/WorkPet.app"
          BIN="$APP/Contents/MacOS/work-pet"

          echo "=== Universal binary ==="
          file "$BIN"
          lipo -info "$BIN"

          echo "=== DMG ==="
          ls -lh src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload macOS universal DMG
        uses: actions/upload-artifact@v4
        with:
          name: WorkPet-macos-universal
          path: desktop-ui/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7
