name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+：daemon 的 CodeArts Agent 账号切换依赖内置 node:sqlite（读写 state.vscdb）
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-ui/src-tauri

      - name: Bundle Node.js runtime and scripts (flat packaging)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-ui/src-tauri/binaries | Out-Null
          Copy-Item "C:/Program Files/nodejs/node.exe" desktop-ui/src-tauri/binaries/node.exe
          Copy-Item "daemon.js" desktop-ui/src-tauri/daemon.js
          Copy-Item "credit-segments.js" desktop-ui/src-tauri/credit-segments.js

      - name: Install dependencies
        working-directory: desktop-ui
        run: npm install

      - name: Build (NSIS installer)
        working-directory: desktop-ui
        run: npx tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workpet-windows
          path: |
            desktop-ui/src-tauri/target/release/workpet.exe
            desktop-ui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    name: Build (macOS Universal 2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Universal Node.js runtime and scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          TAURI_DIR="$ROOT/desktop-ui/src-tauri"
          BIN_DIR="$TAURI_DIR/binaries"
          mkdir -p "$BIN_DIR"

          cp "$ROOT/daemon.js" "$TAURI_DIR/daemon.js"
          cp "$ROOT/credit-segments.js" "$TAURI_DIR/credit-segments.js"

          NODE_VERSION="$(node -p 'process.version')"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          curl --fail --location --retry 3 \
            "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-darwin-x64.tar.gz" \
            -o "$TMP_DIR/node-x64.tar.gz"
          curl --fail --location --retry 3 \
            "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-darwin-arm64.tar.gz" \
            -o "$TMP_DIR/node-arm64.tar.gz"

          tar -xzf "$TMP_DIR/node-x64.tar.gz" -C "$TMP_DIR"
          tar -xzf "$TMP_DIR/node-arm64.tar.gz" -C "$TMP_DIR"

          X64_NODE="$TMP_DIR/node-${NODE_VERSION}-darwin-x64/bin/node"
          ARM64_NODE="$TMP_DIR/node-${NODE_VERSION}-darwin-arm64/bin/node"
          lipo -create "$X64_NODE" "$ARM64_NODE" -output "$BIN_DIR/node"
          chmod +x "$BIN_DIR/node"
          codesign --force --sign - "$BIN_DIR/node"

          echo "=== Bundled Node ==="
          file "$BIN_DIR/node"
          lipo -info "$BIN_DIR/node"
          "$BIN_DIR/node" --version

      - name: Install dependencies
        working-directory: desktop-ui
        run: npm install

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-ui/src-tauri
          key: macos-universal

      - name: Build Universal 2 app and DMG
        working-directory: desktop-ui
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Verify Universal app and bundled Node
        working-directory: desktop-ui
        shell: bash
        run: |
          set -euo pipefail

          BASE="src-tauri/target/universal-apple-darwin/release/bundle"
          APP="$BASE/macos/WorkPet.app"

          echo "=== App bundle ==="
          test -d "$APP"
          ls -la "$APP/Contents/MacOS"

          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP/Contents/Info.plist")

          MAIN="$APP/Contents/MacOS/$EXECUTABLE_NAME"

          echo "=== WorkPet executable ==="
          echo "CFBundleExecutable: $EXECUTABLE_NAME"
          echo "Executable path: $MAIN"

          test -f "$MAIN"
          file "$MAIN"
          lipo -info "$MAIN"
          lipo "$MAIN" -verify_arch x86_64 arm64

          NODE=""
          for p in \
            "$APP/Contents/Resources/binaries/node" \
            "$APP/Contents/Resources/node"; do
            if [ -f "$p" ]; then
              NODE="$p"
              break
            fi
          done

          if [ -z "$NODE" ]; then
            echo "ERROR: bundled Node.js not found"
            echo "=== Resources ==="
            find "$APP/Contents/Resources" -maxdepth 4 -type f -print
            exit 1
          fi

          echo "=== Bundled Node ==="
          echo "Node path: $NODE"
          file "$NODE"
          lipo -info "$NODE"
          lipo "$NODE" -verify_arch x86_64 arm64
          "$NODE" --version

          echo "=== Bundled scripts ==="
          find "$APP/Contents/Resources" -maxdepth 4 -type f \
            \( -name daemon.js -o -name credit-segments.js \) -print

          if ! find "$APP/Contents/Resources" -type f -name daemon.js | grep -q .; then
            echo "ERROR: daemon.js not found"
            exit 1
          fi

          if ! find "$APP/Contents/Resources" -type f -name credit-segments.js | grep -q .; then
            echo "ERROR: credit-segments.js not found"
            exit 1
          fi

          echo "=== DMG ==="
          ls -lh "$BASE/dmg/"*.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: workpet-macos-universal
          path: desktop-ui/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ls -lhR dist

          ASSETS=$(find dist -type f \( -name "*-setup.exe" -o -name "*.dmg" \))
          if [ -z "$ASSETS" ]; then
            echo "ERROR: no release assets found" >&2
            exit 1
          fi
          echo "Assets to upload:"
          echo "$ASSETS"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS \
              --title "WorkPet ${TAG#v}" \
              --generate-notes \
              --latest
          fi
