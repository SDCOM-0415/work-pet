name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    permissions:
      # tag push 时需要写权限创建 Release（v1.0.2 验证过的模式：单 job 内直接发布）
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+：daemon 的 CodeArts Agent 账号切换依赖内置 node:sqlite（读写 state.vscdb）
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-ui/src-tauri

      - name: Bundle Node.js runtime and scripts (flat packaging)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-ui/src-tauri/binaries | Out-Null
          Copy-Item "C:/Program Files/nodejs/node.exe" desktop-ui/src-tauri/binaries/node.exe
          Copy-Item "daemon.js" desktop-ui/src-tauri/daemon.js
          Copy-Item "credit-segments.js" desktop-ui/src-tauri/credit-segments.js

      - name: Install dependencies
        working-directory: desktop-ui
        run: npm install

      - name: Build (NSIS installer)
        working-directory: desktop-ui
        run: npx tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workpet-windows
          path: |
            desktop-ui/src-tauri/target/release/workpet.exe
            desktop-ui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 发布：tag push 时直接从构建目录上传（不经过 artifact 中转；
      # beta/rc/alpha 后缀发布为 prerelease，正式版 --latest）。
      # 诊断信息写入 job summary（匿名浏览器可见），便于发布失败时定位。
      - name: Publish release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          SUM="$GITHUB_STEP_SUMMARY"
          {
            echo "## Release publish diagnostics"
            echo "- tag: \`${TAG}\`"
            echo "- gh: $(gh --version | head -1)"
          } >> "$SUM"

          ASSETS=$(find desktop-ui/src-tauri/target/release/bundle/nsis -type f -name "*-setup.exe" 2>/dev/null)
          {
            echo "- installer files:"
            echo '  ```'
            echo "$ASSETS"
            echo '  ```'
          } >> "$SUM"
          if [ -z "$ASSETS" ]; then
            echo "ERROR: no *-setup.exe found under bundle/nsis" >> "$SUM"
            exit 1
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "- release already exists -> upload assets" >> "$SUM"
            gh release upload "$TAG" $ASSETS --clobber --repo "$REPO" 2>&1 | tee -a "$SUM"
            rc=${PIPESTATUS[0]}
          else
            if echo "$TAG" | grep -Eq -- '-(beta|rc|alpha)'; then
              TITLE="WorkPet ${TAG#v} (Testing)"
              EXTRA=(--prerelease)
            else
              TITLE="WorkPet ${TAG#v}"
              EXTRA=(--latest)
            fi
            echo "- creating new release: $TITLE (prerelease: $([ ${#EXTRA[@]} -gt 0 ] && echo yes || echo no))" >> "$SUM"
            gh release create "$TAG" $ASSETS --repo "$REPO" --title "$TITLE" --generate-notes "${EXTRA[@]}" 2>&1 | tee -a "$SUM"
            rc=${PIPESTATUS[0]}
          fi

          if [ "$rc" -ne 0 ]; then
            echo "### gh release exited with $rc" >> "$SUM"
            exit "$rc"
          fi
          echo "- published OK" >> "$SUM"
