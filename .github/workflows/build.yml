name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-ui/src-tauri

      - name: Bundle Node.js runtime and scripts (flat packaging)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-ui/src-tauri/binaries | Out-Null
          Copy-Item "C:/Program Files/nodejs/node.exe" desktop-ui/src-tauri/binaries/node.exe
          Copy-Item "daemon.js" desktop-ui/src-tauri/daemon.js
          Copy-Item "credit-segments.js" desktop-ui/src-tauri/credit-segments.js

      - name: Install dependencies
        working-directory: desktop-ui
        run: npm install

      - name: Build (NSIS installer)
        working-directory: desktop-ui
        run: npx tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workpet-windows
          path: |
            desktop-ui/src-tauri/target/release/workpet.exe
            desktop-ui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    name: Build (macOS Universal 2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Universal Node.js runtime and scripts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          TAURI_DIR="$ROOT/desktop-ui/src-tauri"
          BIN_DIR="$TAURI_DIR/binaries"
          mkdir -p "$BIN_DIR"

          cp "$ROOT/daemon.js" "$TAURI_DIR/daemon.js"
          cp "$ROOT/credit-segments.js" "$TAURI_DIR/credit-segments.js"

          NODE_VERSION="$(node -p 'process.version')"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          curl --fail --location --retry 3 \
            "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-darwin-x64.tar.gz" \
            -o "$TMP_DIR/node-x64.tar.gz"
          curl --fail --location --retry 3 \
            "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-darwin-arm64.tar.gz" \
            -o "$TMP_DIR/node-arm64.tar.gz"

          tar -xzf "$TMP_DIR/node-x64.tar.gz" -C "$TMP_DIR"
          tar -xzf "$TMP_DIR/node-arm64.tar.gz" -C "$TMP_DIR"

          X64_NODE="$TMP_DIR/node-${NODE_VERSION}-darwin-x64/bin/node"
          ARM64_NODE="$TMP_DIR/node-${NODE_VERSION}-darwin-arm64/bin/node"
          lipo -create "$X64_NODE" "$ARM64_NODE" -output "$BIN_DIR/node"
          chmod +x "$BIN_DIR/node"
          codesign --force --sign - "$BIN_DIR/node"

          echo "=== Bundled Node ==="
          file "$BIN_DIR/node"
          lipo -info "$BIN_DIR/node"
          "$BIN_DIR/node" --version

      - name: Install dependencies
        working-directory: desktop-ui
        run: npm install

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-ui/src-tauri
          key: macos-universal

      - name: Build Universal 2 app and DMG
        working-directory: desktop-ui
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Verify Universal app and bundled Node
        working-directory: desktop-ui
        shell: bash
        run: |
          set -euo pipefail

          BASE="src-tauri/target/universal-apple-darwin/release/bundle"
          APP="$BASE/macos/WorkPet.app"
          MAIN="$APP/Contents/MacOS/work-pet"

          echo "=== WorkPet executable ==="
          test -f "$MAIN"
          file "$MAIN"
          lipo -info "$MAIN"
          lipo "$MAIN" -verify_arch x86_64 arm64

          NODE=""
          for p in \
            "$APP/Contents/Resources/binaries/node" \
            "$APP/Contents/Resources/node"; do
            if [ -f "$p" ]; then
              NODE="$p"
              break
            fi
          done

          test -n "$NODE"

          echo "=== Bundled Node ==="
          file "$NODE"
          lipo -info "$NODE"
          lipo "$NODE" -verify_arch x86_64 arm64
          "$NODE" --version

          echo "=== Bundled scripts ==="
          find "$APP/Contents/Resources" -maxdepth 3 -type f \
            \( -name daemon.js -o -name credit-segments.js \) -print

          find "$APP/Contents/Resources" -type f -name daemon.js | grep -q .
          find "$APP/Contents/Resources" -type f -name credit-segments.js | grep -q .

          echo "=== DMG ==="
          ls -lh "$BASE/dmg/"*.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: workpet-macos-universal
          path: desktop-ui/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: workpet-windows
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: workpet-macos-universal
          path: artifacts/macos

      - name: Publish release (tag = version from tauri.conf.json)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="$(node -p "require('./desktop-ui/src-tauri/tauri.conf.json').version")"
          TAG="v${VER}"
          INSTALLER="$(find artifacts/windows -type f -name '*.exe' | grep -E 'setup|installer' | head -n 1 || true)"
          if [ -z "$INSTALLER" ]; then
            INSTALLER="$(find artifacts/windows -type f -name '*.exe' | head -n 1)"
          fi
          DMG="$(find artifacts/macos -type f -name '*.dmg' | head -n 1)"

          cp "$INSTALLER" "WorkPet_${VER}_x64-setup.exe"
          cp "$DMG" "WorkPet_${VER}_universal.dmg"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "WorkPet_${VER}_x64-setup.exe" \
              "WorkPet_${VER}_universal.dmg" \
              --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" \
              "WorkPet_${VER}_x64-setup.exe" \
              "WorkPet_${VER}_universal.dmg" \
              --repo "${{ github.repository }}" \
              --title "WorkPet $VER" \
              --notes "WorkPet $VER 自动构建"
          fi
