name: Build WorkPet

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: desktop-ui
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop-ui/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop-ui/src-tauri/Cargo.lock') }}

      - name: Build Tauri app (Windows)
        working-directory: desktop-ui
        run: npx tauri build

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkPet-windows-x64
          path: desktop-ui/src-tauri/bin/release/bundle/nsis/
          retention-days: 7

  build-macos:
    name: Build (macOS universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare JS resources (copy, not symlink)
        run: |
          cp "$(git -C "$(pwd)" rev-parse --show-toplevel)/daemon.js" \
             desktop-ui/src-tauri/daemon.js
          cp "$(git -C "$(pwd)" rev-parse --show-toplevel)/credit-segments.js" \
             desktop-ui/src-tauri/credit-segments.js
          ls -la desktop-ui/src-tauri/daemon.js desktop-ui/src-tauri/credit-segments.js

      - name: Install frontend deps
        working-directory: desktop-ui
        run: npm ci

      - name: Install Rust stable (both targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop-ui/src-tauri/target/
          key: ${{ runner.os }}-macos-universal-cargo-${{ hashFiles('desktop-ui/src-tauri/Cargo.lock') }}

      # Build x86_64 first (sets the node binary in src-tauri/binaries/)
      - name: Build Tauri app (x86_64)
        working-directory: desktop-ui
        run: npx tauri build --target x86_64-apple-darwin

      # Build arm64 — this overwrites binaries/node with arm64 version
      # We save the x86_64 binary before this
      - name: Save x86_64 app bundle
        run: |
          cp -R src-tauri/target/x86_64-apple-darwin/release/bundle/macos/WorkPet.app \
                src-tauri/target/release/WorkPet-x86_64.app
          cp -R src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/ \
                src-tauri/target/release/dmg-x86_64/

      - name: Build Tauri app (aarch64)
        working-directory: desktop-ui
        run: npx tauri build --target aarch64-apple-darwin

      - name: Create universal binary via lipo
        run: |
          AARCH_BIN="src-tauri/target/aarch64-apple-darwin/release/work-pet"
          X64_BIN="src-tauri/target/x86_64-apple-darwin/release/work-pet"
          UNIVERSAL="src-tauri/target/release/work-pet-universal"
          lipo -create "$AARCH_BIN" "$X64_BIN" -output "$UNIVERSAL"
          echo "=== Universal binary ==="
          file "$UNIVERSAL"

      - name: Replace binary in saved x86_64 app bundle
        run: |
          cp src-tauri/target/release/work-pet-universal \
             src-tauri/target/release/WorkPet-x86_64.app/Contents/MacOS/work-pet
          chmod +x src-tauri/target/release/WorkPet-x86_64.app/Contents/MacOS/work-pet
          codesign --force --deep --sign - \
            src-tauri/target/release/WorkPet-x86_64.app --options runtime 2>/dev/null || true

      - name: Create universal DMG
        run: |
          APP=src-tauri/target/release/WorkPet-x86_64.app
          OUT_DIR=src-tauri/target/release/bundle/dmg
          mkdir -p "$OUT_DIR"
          # Read-write temp DMG
          hdiutil create -volname "WorkPet" \
            -srcfolder "$APP" \
            -fs HFS+ -format UDRW -size 300m \
            "/tmp/WorkPet-temp.dmg"
          # Mount, add Applications symlink, unmount
          DEV=$(hdiutil attach -readwrite -noverify -noautoopen "/tmp/WorkPet-temp.dmg" \
                  | grep '/dev/' | awk '{print $1}' | head -1)
          if [ -n "$DEV" ]; then
            MOUNT=$(hdiutil info | grep "$DEV" | awk '{print $NF}' | head -1)
            [ -n "$MOUNT" ] && ln -s /Applications "$MOUNT/Applications"
            hdiutil detach "$DEV"
          fi
          # Compress to final DMG
          hdiutil convert "/tmp/WorkPet-temp.dmg" \
            -format UDZO -o "$OUT_DIR/WorkPet-universal.dmg"
          rm -f "/tmp/WorkPet-temp.dmg"
          echo "=== DMG created ==="
          ls -lh "$OUT_DIR/WorkPet-universal.dmg"

      - name: Upload macOS universal DMG
        uses: actions/upload-artifact@v4
        with:
          name: WorkPet-macos-universal
          path: desktop-ui/src-tauri/target/release/bundle/dmg/WorkPet-universal.dmg
          retention-days: 7
